# Nightly retrieval-eval model gate (#364): `pnpm eval --gate` = rerank ON pass + fusion-only pass
# against their frozen baselines, with the embedding + reranker models cached between runs.
# REPORT-ONLY for now: the baselines were frozen on macOS and no Linux baseline exists yet, so a
# red gate here is a signal to read, not a verdict (see test/eval/README.md "Nightly CI").
# Not a required check; no secrets; read-only token.
name: Eval nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, off the hour to dodge the scheduled-run rush
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-nightly
  cancel-in-progress: false

env:
  HUSKY: "0" # no git hooks in CI

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # ~8 min gate + a cold ~0.7 GB model download on the first run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The cache key names both model ids and the transformers.js version (they decide what the
      # cache holds). Fail fast if the code moved on, so a stale key can't serve the wrong models.
      - name: Check the cache key still names the models in use
        run: |
          grep -q '"Xenova/multilingual-e5-small"' src/semantic/model.ts
          grep -q '"onnx-community/bge-reranker-v2-m3-ONNX"' src/semantic/reranker.ts
      - name: Read the resolved transformers.js version
        id: tf
        # from the lockfile, not the package.json specifier, so a range can never land in the key
        run: |
          v=$(grep -m1 -oE "'@huggingface/transformers@[^':]+'" pnpm-lock.yaml | sed -E "s/.*@([^@']+)'/\1/")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Restore model cache
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # run.ts keeps models under <work-dir>/models; the default work dir is gitignored
          path: test/eval/retrieval/.work/models
          key: eval-models-${{ runner.os }}-Xenova-multilingual-e5-small-onnx-community-bge-reranker-v2-m3-ONNX-transformers-${{ steps.tf.outputs.version }}
      - name: Model cache status
        run: |
          echo "model cache hit: ${{ steps.models.outputs.cache-hit }} (transformers ${{ steps.tf.outputs.version }})"
          echo "model cache hit: \`${{ steps.models.outputs.cache-hit }}\` (transformers \`${{ steps.tf.outputs.version }}\`)" >> "$GITHUB_STEP_SUMMARY"
      # run.ts symlinks <work-dir>/models into each pass's throwaway dir ONLY if it exists; on a
      # cold run without it the e5 model would download into the discarded dir and never be cached.
      - run: mkdir -p test/eval/retrieval/.work/models

      # Report-only: a failing gate must not turn the run red until a Linux baseline exists. The
      # outcome goes to the log, an annotation and the job summary instead.
      - name: Run the model gate
        id: gate
        continue-on-error: true
        run: pnpm eval --gate --out-dir "$RUNNER_TEMP/eval-reports"
      - name: Report the gate outcome
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            echo "::notice::eval gate outcome: success"
          else
            echo "::warning::eval gate outcome: ${{ steps.gate.outcome }} (report-only, not blocking)"
          fi
          echo "eval gate outcome: \`${{ steps.gate.outcome }}\` (report-only until a Linux baseline exists)" >> "$GITHUB_STEP_SUMMARY"

      # Both models must be fully there before the cache is saved: a crashed or partial download
      # would otherwise be stored under the same key and stick (an exact-key hit never re-saves).
      - name: Check both models are in the cache dir
        id: models_ok
        if: always()
        run: |
          dir=test/eval/retrieval/.work/models
          ok=true
          for m in Xenova/multilingual-e5-small onnx-community/bge-reranker-v2-m3-ONNX; do
            if [ -z "$(find "$dir/$m" -name '*.onnx' -type f 2>/dev/null | head -1)" ]; then ok=false; fi
          done
          echo "complete=$ok" >> "$GITHUB_OUTPUT"
          {
            echo "model cache dir: \`$(du -sh "$dir" 2>/dev/null | cut -f1)\` (complete: \`$ok\`)"
            echo '```'
            find "$dir" -maxdepth 2 -mindepth 2 -type d 2>/dev/null | sort
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save model cache
        if: always() && steps.models.outputs.cache-hit != 'true' && steps.models_ok.outputs.complete == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/eval/retrieval/.work/models
          key: ${{ steps.models.outputs.cache-primary-key }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports
          path: ${{ runner.temp }}/eval-reports/
          if-no-files-found: warn
          retention-days: 30
