allowBuilds:
  "@modelcontextprotocol/inspector": true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
# transitive CVE fixes (via @huggingface/transformers): sharp GHSA-f88m-g3jw-g9cj, adm-zip 4GB zip bomb
overrides:
  sharp: ">=0.35.5"
  adm-zip: ">=0.6.1"
  # dev-only transitive CVE fixes: fast-uri (ajv), source-map-js (magicast), @hono/node-server (inspector)
  fast-uri: ">=3.1.9 <4"
  source-map-js: ">=1.2.2 <2"
  "@hono/node-server": ">=2.1.3 <3"
