# Release pipeline, driven by release-please:
#   push to main -> release-please opens/updates the release PR (version bump in package.json,
#   server.json, manifest.json, .claude-plugin/plugin.json + CHANGELOG.md from Conventional
#   Commits). Merging that PR creates the vX.Y.Z tag + GitHub release, and the `publish` job
#   below runs IN THIS SAME WORKFLOW: npm publish (with provenance) -> .mcpb on the GitHub
#   release -> MCP Registry.
# Why one workflow: a tag created with GITHUB_TOKEN does not trigger other workflows'
# `on: push: tags`, so a separate tag-triggered release workflow would never run.
# Escape hatch: Actions -> Release -> Run workflow with an existing tag re-runs `publish`
# for that tag (e.g. after a transient registry failure).
#
# npm auth = Trusted Publishing (OIDC), configured on npmjs.com under the package's
# Settings -> Trusted Publisher (repo caelum29/calibre-mcp, workflow release.yml).
# No secrets anywhere: MCP Registry auth is also OIDC (io.github.caelum29 namespace).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.7.5"
        required: true
        type: string

permissions:
  contents: read

# Never cancel a release half-way; queue instead.
concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # release commit, tag, GitHub release
      pull-requests: write # the release PR
      issues: write # release-please labels the release PR (autorelease: pending/tagged) via the issues API
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # !cancelled(): on workflow_dispatch the release-please job is skipped, which would
    # otherwise skip this dependent job too.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write # npm provenance + mcp-publisher OIDC
      contents: write # upload the .mcpb to the GitHub release
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      # No registry-url here: it writes an .npmrc _authToken placeholder that overrides
      # the OIDC trusted-publishing flow with an empty token (PUT then 404s).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches package.json version
        run: |
          PKG_V="$(node -p "require('./package.json').version")"
          [ "v$PKG_V" = "$TAG" ] || { echo "tag $TAG != package.json v$PKG_V"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm typecheck

      # Pinned + checksum-verified: this job holds id-token: write, so a moved `latest`
      # asset must not be able to run here. The sha256 is the linux_amd64 entry of the
      # release's registry_<ver>_checksums.txt (the job runs on ubuntu, x86_64).
      - name: Install mcp-publisher (pinned)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # server.json versions are committed (release-please bumps them, pnpm versions:check
      # gates them), not rewritten here — what is published is what is in the tagged commit.
      # Validated before npm publish so a bad server.json fails the release before anything ships.
      - name: Validate server.json against the MCP Registry
        run: ./mcp-publisher validate

      # Trusted-publishing OIDC auto-detection needs npm >= 11.5.1; runners can lag.
      # Pin to 11.18.0 — npm@latest (12.0.0) ships a libnpmpublish whose provenance
      # code can't resolve its `sigstore` dep, breaking `npm publish --provenance`.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.18.0 && npm --version

      # prepublishOnly runs versions:check + build + tests; auth is OIDC (trusted publisher).
      # Skipped when the version is already on npm, so a failed run can be re-run safely.
      - name: Publish to npm
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "calibre-mcp@$V" version --prefer-online >/dev/null 2>&1; then
            echo "calibre-mcp@$V already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Build the MCPB bundle
        run: pnpm pack:mcpb

      # release-please already created the GitHub release; `create` only matters for a
      # workflow_dispatch re-run of a tag that has no release yet.
      - name: Attach the .mcpb to the GitHub release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" dist-mcpb/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # the registry validates the npm version right away; wait out npm propagation lag
      - name: Wait for the version on npm
        run: |
          V="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            npm view "calibre-mcp@$V" version --prefer-online >/dev/null 2>&1 && { echo "npm has $V"; exit 0; }
            sleep 10
          done
          echo "calibre-mcp@$V not visible on npm after 5 min"; exit 1

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "registry publish failed (attempt $i); retrying in 30s"; sleep 30
          done
          exit 1
