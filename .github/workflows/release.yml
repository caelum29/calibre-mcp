# Release pipeline, triggered by pushing a v* tag:
#   npm publish (with provenance) -> .mcpb on the GitHub release -> MCP Registry.
# Requires: NPM_TOKEN repo secret (granular automation token with publish rights).
# MCP Registry auth is OIDC — no secret needed (io.github.caelum29 namespace).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + mcp-publisher OIDC
      contents: write # create the GitHub release / upload the .mcpb
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json version
        run: |
          PKG_V="$(node -p "require('./package.json').version")"
          [ "v$PKG_V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$PKG_V"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      # prepublishOnly runs build + tests
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build the MCPB bundle
        run: pnpm pack:mcpb

      - name: Create GitHub release with the .mcpb
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version from package.json
        run: |
          V="$(node -p "require('./package.json').version")"
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
