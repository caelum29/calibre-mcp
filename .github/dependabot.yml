# Weekly, grouped update PRs. Dependencies are exact-pinned, so nothing moves without one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # An MCP SDK major is a migration (codemod + hand edits + live host checks, #123), not a
      # routine bump; ext-apps majors track SDK majors, so they move with that migration too
      - dependency-name: "@modelcontextprotocol/server"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@modelcontextprotocol/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@modelcontextprotocol/ext-apps"
        update-types: ["version-update:semver-major"]
      # TS 7 (native compiler) is a toolchain migration, not a routine bump
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # typings must match the supported Node runtimes (engines >=22.16), not the latest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # server (prod) and client (dev) ship from one release train; bump them in one PR so a
      # test client never runs ahead of the server it tests
      mcp-sdk:
        patterns: ["@modelcontextprotocol/server", "@modelcontextprotocol/client"]
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [patch]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
