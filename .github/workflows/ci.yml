# Static checks + unit tests on every push to main and every PR. The gated model tests
# (RUN_MODEL_TESTS) and live-Calibre tests (RUN_CALIBRE_TESTS) stay excluded — no 118 MB
# model download and no Calibre install in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs supersede each other; pushes to main always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0" # no git hooks in CI

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm versions:check
      - run: pnpm build
      - run: pnpm catalog:check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "22", "24"] # 22.16.0 = engines minimum (first 22.x with unflagged node:sqlite + FTS5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        if: matrix.node != '24'
      # Coverage (with the ratchet thresholds in vitest.config.ts) once, on the .nvmrc Node.
      - run: pnpm test:coverage
        if: matrix.node == '24'
