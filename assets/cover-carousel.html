<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calibre-mcp · cover carousel</title>
<style>
/* ============ tokens — the ONLY place colors live ============ */
:root{
  color-scheme: light dark;
  /* fallbacks (no light-dark support) */
  --bg:#faf7f2; --tx:#33302b; --tx-muted:#8a8378; --card:#ffffff;
  --line:rgba(60,50,40,.14); --accent:#c67139; --btn:#ffffff;
  /* live tokens */
  --bg: light-dark(#faf7f2, #262624);
  --tx: light-dark(#33302b, #ece9e3);
  --tx-muted: light-dark(#8a8378, #9c958a);
  --card: light-dark(#ffffff, #31302e);
  --line: light-dark(rgba(60,50,40,.14), rgba(255,255,255,.13));
  --accent: light-dark(#c67139, #d98d55);
  --accent-tint: light-dark(rgba(198,113,57,.12), rgba(217,141,85,.16));
  --btn: light-dark(rgba(255,255,255,.94), rgba(49,48,46,.94));
  --skel: light-dark(rgba(60,50,40,.08), rgba(255,255,255,.07));
  --skel-hi: light-dark(rgba(255,255,255,.65), rgba(255,255,255,.09));
  --shadow: 0 1px 2px rgba(0,0,0,.07), 0 5px 16px rgba(0,0,0,.09);
  --shadow-lg: 0 2px 4px rgba(0,0,0,.09), 0 10px 26px rgba(0,0,0,.14);
  --scrim: light-dark(rgba(255,253,250,.88), rgba(38,38,36,.88));
  /* book-volume knobs */
  --spine: light-dark(rgba(0,0,0,.16), rgba(0,0,0,.42));
  --crease: light-dark(rgba(255,255,255,.55), rgba(255,255,255,.14));
  --sheen: light-dark(rgba(255,255,255,.26), rgba(255,255,255,.05));
  --pages: light-dark(#f1ebe0, #46453f);
  --pages-line: light-dark(#d8d0c2, #2c2b28);
  --pagestack: 1.5px 0 0 var(--pages), 2.5px 0 0 var(--pages-line), 4px 0 0 var(--pages), 5px 0 0 var(--pages-line);
  /* generated-cover knobs (hue arrives per-card via --h/--h2) */
  --cov-l:84%; --cov-l2:73%; --cov-c:.05; --cov-c2:.075;
  --cov-tx-l:29%; --cov-tx-c:.055;
  --cov-line:rgba(0,0,0,.10); --cov-shine:rgba(255,255,255,.35);
}
:root[data-theme="light"]{ color-scheme:light; }
:root[data-theme="dark"]{ color-scheme:dark; }
:root[data-theme="dark"]{
  --cov-l:39%; --cov-l2:30%; --cov-c:.045; --cov-c2:.06;
  --cov-tx-l:91%; --cov-tx-c:.03;
  --cov-line:rgba(255,255,255,.12); --cov-shine:rgba(255,255,255,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cov-l:39%; --cov-l2:30%; --cov-c:.045; --cov-c2:.06;
    --cov-tx-l:91%; --cov-tx-c:.03;
    --cov-line:rgba(255,255,255,.12); --cov-shine:rgba(255,255,255,.08);
  }
}
/* ============ base ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--tx);
  font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding:10px 0 0;
}
a{color:var(--accent)} a:hover{color:var(--tx)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ============ widget shell ============ */
.widget{position:relative; max-width:800px; margin:0 auto;}
.meta{
  display:flex; align-items:baseline; gap:12px;
  padding:0 18px 6px; min-height:20px;
}
.meta .note{
  font-size:12.5px; color:var(--tx-muted);
  display:none; align-items:center; gap:6px;
}
.meta .note::before{
  content:""; width:7px; height:7px; border-radius:50%;
  background:var(--accent); opacity:.7; flex:none; display:inline-block;
}
.widget[data-lowconf="1"] .meta .note{display:inline-flex}
.meta .pos{margin-left:auto; font-size:12px; color:var(--tx-muted); font-variant-numeric:tabular-nums; white-space:nowrap;}

/* ============ shelf / carousel ============ */
.shelf{position:relative}
.strip{
  display:flex; gap:14px; align-items:flex-start;
  overflow-x:auto; overscroll-behavior-x:contain;
  scroll-snap-type:x proximity; scroll-behavior:smooth; scroll-padding-inline:18px;
  padding:6px 18px 10px; margin:0; list-style:none;
  scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.item{position:relative; flex:none; scroll-snap-align:start; width:134px;}
.card{
  display:flex; flex-direction:column; gap:8px; width:100%;
  text-align:left; border-radius:14px; padding:0;
}
.cover{
  position:relative; display:block; width:134px; height:178px;
  border-radius:4px 11px 11px 4px; /* square spine edge, rounded fore-edge */
  overflow:hidden;
  box-shadow:var(--pagestack), var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease;
}
.cover::before{ /* spine crease + top sheen = volume */
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none; border-radius:inherit;
  background:
    linear-gradient(90deg, var(--spine) 0%, transparent 9%),
    linear-gradient(90deg, transparent 4.5%, var(--crease) 7%, transparent 11%),
    linear-gradient(168deg, var(--sheen) 0%, transparent 24%);
}
.item:hover .cover{transform:translateY(-3px); box-shadow:var(--pagestack), var(--shadow-lg)}
.card[aria-pressed="true"] .cover{
  outline:2.5px solid var(--accent); outline-offset:2px;
}
/* generated placeholder cover */
.ph{
  position:absolute; inset:0; display:flex; flex-direction:column;
  padding:12px 11px 10px;
  background:linear-gradient(160deg,
    oklch(var(--cov-l) var(--cov-c) var(--h)) 0%,
    oklch(var(--cov-l2) var(--cov-c2) var(--h2)) 100%);
  color:oklch(var(--cov-tx-l) var(--cov-tx-c) var(--h));
}
.ph::after{ /* inner rule = deliberate "printed cover" feel */
  content:""; position:absolute; inset:6px; border-radius:7px;
  border:1px solid var(--cov-line); pointer-events:none;
}
.ph .mark{
  width:22px; height:22px; border-radius:50%;
  background:var(--cov-shine); margin-bottom:10px; flex:none;
}
.ph[data-v="1"] .mark{border-radius:6px}
.ph[data-v="2"] .mark{width:34px; height:10px; border-radius:999px}
.ph .pt{
  font-size:13px; line-height:1.25; font-weight:650; letter-spacing:.01em;
  display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
  overflow-wrap:anywhere; text-wrap:pretty;
}
.ph .pa{
  margin-top:auto; font-size:10.5px; opacity:.75;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ph .pt.raw{ /* raw filename → typewriter-ish, still intentional */
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight:500; font-size:11.5px;
}
.cover img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; background:var(--card);
}
.cover img[data-broken]{display:none}
/* score badge (semantic only) */
.score{
  position:absolute; left:7px; bottom:7px; z-index:2;
  font-size:10px; font-variant-numeric:tabular-nums;
  padding:2px 7px; border-radius:999px;
  background:var(--scrim); color:var(--tx-muted);
  display:none;
}
[data-mode="semantic"] .score{display:block}
[data-mode="semantic"] .ph .pa{padding-left:44px} /* reserve room for score badge */
/* opening chip */
.opening{
  position:absolute; inset:auto 7px 7px auto; z-index:2;
  font-size:10.5px; padding:3px 8px; border-radius:999px;
  background:var(--accent); color:#fff;
  opacity:0; transform:translateY(4px);
  transition:opacity .15s ease, transform .15s ease;
  pointer-events:none;
}
.card.is-opening .opening{opacity:1; transform:none}
/* text under cover */
.t{
  font-size:12.5px; line-height:1.3; font-weight:550;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  overflow-wrap:anywhere;
}
.a{
  font-size:11.5px; color:var(--tx-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* read affordance */
.read{
  position:absolute; top:7px; right:7px; z-index:3;
  font-size:11px; padding:3.5px 10px; border-radius:999px;
  background:var(--btn); color:var(--tx); box-shadow:var(--shadow);
  opacity:0; transform:translateY(-3px);
  transition:opacity .15s ease, transform .15s ease;
}
.item:hover .read, .item:focus-within .read{opacity:1; transform:none}
.read:hover{background:var(--accent-tint); color:var(--accent)}
/* nav arrows */
.arrow{
  position:absolute; top:76px; z-index:4;
  width:34px; height:34px; border-radius:50%;
  background:var(--btn); box-shadow:var(--shadow-lg);
  display:grid; place-items:center;
  transition:opacity .15s ease;
}
.arrow:hover{background:var(--accent-tint)}
.arrow svg{stroke:var(--tx); stroke-width:2.75; fill:none; stroke-linecap:round; stroke-linejoin:round}
.arrow[disabled]{opacity:0; pointer-events:none}
.arrow.prev{left:8px} .arrow.next{right:8px}

/* ============ skeleton ============ */
.skel .cover-s{
  width:134px; height:178px; border-radius:11px; flex:none;
  background:var(--skel); position:relative; overflow:hidden;
}
.skel .l1,.skel .l2{height:10px; border-radius:6px; background:var(--skel)}
.skel .l1{width:80%; margin-top:9px} .skel .l2{width:55%; margin-top:6px}
.cover-s::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 30%, var(--skel-hi) 50%, transparent 70%);
  transform:translateX(-100%); animation:shimmer 1.4s infinite;
}
@keyframes shimmer{to{transform:translateX(100%)}}

/* ============ empty / error ============ */
.flat{
  display:none; align-items:center; gap:10px;
  padding:18px; font-size:13px; color:var(--tx-muted);
}
.flat b{color:var(--tx); font-weight:550}
.flat .q{
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:12px; background:var(--skel); padding:2px 7px; border-radius:6px;
}
.retry{
  padding:4px 13px; border-radius:999px; font-size:12.5px;
  background:var(--accent-tint); color:var(--accent); font-weight:550;
}
.retry:hover{background:var(--accent); color:#fff}

/* state switching */
.widget[data-state="loading"] .view-loading{display:block}
.widget[data-state="results"] .view-results{display:block}
.widget[data-state="empty"] .view-empty{display:flex}
.widget[data-state="error"] .view-error{display:flex}
.view{display:none}

/* ============ dev toolbar (mockup only) ============ */
.devbar{
  max-width:800px; margin:12px auto 10px; padding:8px 14px;
  border:1.5px dashed var(--line); border-radius:14px;
  display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center;
  font-size:11.5px; color:var(--tx-muted);
}
.devbar .grp{display:flex; align-items:center; gap:5px}
.devbar .lbl{margin-right:2px; text-transform:uppercase; letter-spacing:.06em; font-size:9.5px}
.devbar button{
  padding:2.5px 9px; border-radius:999px; font-size:11.5px; color:var(--tx-muted);
}
.devbar button:hover{background:var(--skel)}
.devbar button[aria-pressed="true"]{background:var(--accent-tint); color:var(--accent); font-weight:600}

/* ============ alt: coverflow (edges shrink) ============ */
.altlabel{max-width:800px; margin:14px auto 2px; padding:0 18px;
  font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--tx-muted)}
.flow{position:relative; max-width:800px; margin:0 auto 12px}
.fscroll{position:relative; overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
  scroll-snap-type:x mandatory; scroll-behavior:smooth}
.fscroll::-webkit-scrollbar{display:none}
.fsticky{position:sticky; left:0; width:100%; height:246px; overflow:hidden}
.fstage{position:absolute; inset:0; margin:0; padding:0; list-style:none; perspective:1100px}
.frow{display:flex; height:1px; width:max-content} /* padding set in JS (px) so scroll range is exact */
.fsnap{flex:none; width:70px; scroll-snap-align:center}
.fitem{position:absolute; left:50%; top:12px; width:150px; margin-left:-75px;
  will-change:transform}
.fitem .cover{width:150px; height:200px; border-radius:4px 10px 10px 4px;
  -webkit-box-reflect:below 3px linear-gradient(transparent 62%, rgba(0,0,0,.15))}
.fitem:hover .cover{transform:none}
.fitem .card{width:150px; gap:0}
.fitem .card[aria-pressed="true"] .cover{outline-offset:3px}
.flabel{display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:2px 18px 0; text-align:center; min-height:44px}
.flabel .ft{font-size:13px; font-weight:600; line-height:1.3; max-width:420px;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.flabel .fa{font-size:11.5px; color:var(--tx-muted)}
.flabel .fread{margin-top:3px; font-size:11px; padding:3px 12px; border-radius:999px;
  background:var(--accent-tint); color:var(--accent); font-weight:550}
.flabel .fread:hover{background:var(--accent); color:#fff}
.flow .arrow{top:106px}
.flow .fpos{position:absolute; top:0; right:18px; font-size:12px; color:var(--tx-muted);
  font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  .strip{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="widget" id="w" data-state="loading" data-mode="semantic" data-lowconf="0">
  <div class="meta">
    <span class="note">Weak matches — try rephrasing your query</span>
    <span class="pos" id="pos"></span>
  </div>

  <div class="view view-loading">
    <ul class="strip" aria-hidden="true" id="skelStrip"></ul>
  </div>

  <div class="view view-results">
    <div class="shelf">
      <ul class="strip" id="strip" role="listbox" aria-label="Search results"></ul>
      <button class="arrow prev" id="prev" aria-label="Previous results"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="arrow next" id="next" aria-label="Next results"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>

  <div class="view view-empty flat">
    <span><b>No books matched</b>&nbsp; <span class="q" id="emptyQ">consensus protocols in erlang</span></span>
  </div>

  <div class="view view-error flat">
    <span>Couldn’t load results</span>
    <button class="retry" id="retry">Retry</button>
  </div>
</div>

<div class="altlabel">alt · coverflow — edges recede &amp; shrink</div>
<div class="flow" id="flow" data-mode="semantic">
  <span class="fpos" id="fpos"></span>
  <div class="fscroll" id="fscroll" tabindex="0" role="listbox" aria-label="Search results, coverflow">
    <div class="fsticky"><ul class="fstage" id="fstage"></ul></div>
    <div class="frow" id="frow"></div>
  </div>
  <button class="arrow prev" id="fprev" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="arrow next" id="fnext" aria-label="Next"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="flabel"><div class="ft" id="ft"></div><div class="fa" id="fa"></div>
    <button class="fread" id="fread">Read</button></div>
</div>

<div class="devbar" aria-label="Mockup dev toolbar">
  <div class="grp" data-set="theme"><span class="lbl">theme</span>
    <button data-v="auto" aria-pressed="true">auto</button><button data-v="light">light</button><button data-v="dark">dark</button>
  </div>
  <div class="grp" data-set="state"><span class="lbl">state</span>
    <button data-v="loading">loading</button><button data-v="results" aria-pressed="true">results</button><button data-v="empty">empty</button><button data-v="error">error</button><button data-v="lowconf">low-conf</button>
  </div>
  <div class="grp" data-set="mode"><span class="lbl">mode</span>
    <button data-v="keyword">keyword</button><button data-v="semantic" aria-pressed="true">semantic</button>
  </div>
  <div class="grp" data-set="count"><span class="lbl">count</span>
    <button data-v="3">3</button><button data-v="12" aria-pressed="true">12</button><button data-v="40">40</button>
  </div>
</div>

<script>
"use strict";
/* ================= MCP seams (wired later) =================
   onCardClick(bookId) → tools/call calibre_get_book
   onRead(bookId)      → ui/open-link (host may block)
   reportSize()        → ui/size-changed postMessage           */
function onCardClick(bookId){ console.log("[stub] tools/call get_book", bookId); }
function onRead(bookId){ console.log("[stub] ui/open-link read", bookId); }
function reportSize(){ /* postMessage height to host */ }

/* ================= fake data ================= */
const BOOKS=[
 {bookId:412,title:"Designing Data-Intensive Applications",authors:["Martin Kleppmann"],score:0.91,hasCover:true},
 {bookId:501,title:"Kafka: The Definitive Guide",authors:["Gwen Shapira","Todd Palino","Rajini Sivaram"],score:0.88,hasCover:true},
 {bookId:610,title:"Высоконагруженные приложения",authors:["Мартин Клеппман"],score:0.86,hasCover:false},
 {bookId:731,title:"Чистая архитектура",authors:["Роберт Мартин"],score:0.83,hasCover:false},
 {bookId:322,title:"The Rust Programming Language",authors:["Steve Klabnik","Carol Nichols"],score:0.81,hasCover:true},
 {bookId:404,title:"Грокаем алгоритмы",authors:["Адитья Бхаргава"],score:0.79,hasCover:false},
 {bookId:255,title:"Site Reliability Engineering: How Google Runs Production Systems",authors:["Betsy Beyer","Chris Jones"],score:0.78,hasCover:false},
 {bookId:147,title:"Refactoring: Improving the Design of Existing Code",authors:["Martin Fowler"],score:0.75,hasCover:false},
 {bookId:889,title:"Distributed Systems: Principles and Paradigms",authors:["Andrew S. Tanenbaum","Maarten van Steen"],score:0.72,hasCover:false},
 {bookId:88,title:"top.dvi",authors:[],score:0.64,hasCover:false},
 {bookId:93,title:"programirovanie_na_C_final_v2.pdf",authors:[],score:0.63,hasCover:false},
 {bookId:58,title:"scan_0021_ocr",authors:[],score:0.62,hasCover:false},
];
const SUFFIX=[", 2nd Edition"," (draft)"," — Vol. 2",""," (annotated)"];
function bookAt(i){ // deterministic expansion past 12
  const b=BOOKS[i%BOOKS.length];
  if(i<BOOKS.length) return b;
  const raw=isRaw(b.title);
  return {...b, bookId:b.bookId+1000+i,
    title: raw? b.title : b.title+SUFFIX[i%SUFFIX.length],
    hasCover:false, score:Math.max(.6,b.score-0.01*Math.floor(i/12))};
}
function isRaw(t){ return /[\/_]|\.(pdf|dvi|djvu|epub|fb2)$/i.test(t) || /^scan|^\d{6,}/i.test(t); }

/* ================= deterministic placeholder ================= */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h;}

/* ================= rendering ================= */
const w=document.getElementById("w"), strip=document.getElementById("strip"),
      pos=document.getElementById("pos"), prev=document.getElementById("prev"),
      next=document.getElementById("next");
const S={theme:"auto",state:"results",mode:"semantic",count:12,selected:null,focusIdx:0};

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderResults(){
  const n=S.count, frag=[];
  for(let i=0;i<n;i++){
    const b=bookAt(i), h=hash(b.title)%360, h2=(h+38)%360, v=hash(b.title)%3;
    const raw=isRaw(b.title), authors=b.authors.join(", ");
    frag.push(`<li class="item" data-idx="${i}">
      <button class="card" role="option" aria-selected="false" aria-pressed="false"
              data-id="${b.bookId}" tabindex="${i===0?0:-1}">
        <span class="cover" style="--h:${h};--h2:${h2}">
          <span class="ph" data-v="${v}"><span class="mark"></span>
            <span class="pt${raw?" raw":""}">${esc(b.title)}</span>
            <span class="pa">${esc(authors)}</span></span>
          ${b.hasCover?`<img alt="" src="http://localhost:8080/get/thumb/${b.bookId}/lib" onerror="this.setAttribute('data-broken','')">`:""}
          <span class="score">${b.score.toFixed(2)}</span>
          <span class="opening">Opening…</span>
        </span>
        <span class="t">${esc(b.title)}</span>
        <span class="a">${esc(authors)||"&nbsp;"}</span>
      </button>
      <button class="read" tabindex="-1" aria-label="Read ${esc(b.title)} in external viewer">Read</button>
    </li>`);
  }
  strip.innerHTML=frag.join("");
  strip.scrollLeft=0; S.focusIdx=0; S.selected=null;
  updatePosition(); reportSize();
}

function renderSkeleton(){
  const s=document.getElementById("skelStrip");
  s.innerHTML=Array.from({length:7},()=>'<li class="item skel"><div class="cover-s"></div><div class="l1"></div><div class="l2"></div></li>').join("");
}

/* ================= position indicator + arrows ================= */
function cardStep(){const it=strip.querySelector(".item");return it?it.offsetWidth+14:148;}
function updatePosition(){
  const n=S.count, vis=Math.max(1,Math.floor(strip.clientWidth/cardStep()));
  const first=Math.min(n-vis,Math.round(strip.scrollLeft/cardStep()));
  const a=Math.max(1,first+1), b=Math.min(n,first+vis);
  pos.textContent=S.state==="results"||S.state==="lowconf"?`${a}–${b} of ${n}`:"";
  const max=strip.scrollWidth-strip.clientWidth-2;
  prev.disabled=strip.scrollLeft<=2; next.disabled=strip.scrollLeft>=max;
}
strip.addEventListener("scroll",()=>requestAnimationFrame(updatePosition));
prev.addEventListener("click",()=>strip.scrollBy({left:-strip.clientWidth+40,behavior:"smooth"}));
next.addEventListener("click",()=>strip.scrollBy({left:strip.clientWidth-40,behavior:"smooth"}));

/* ================= interactions ================= */
strip.addEventListener("click",e=>{
  const read=e.target.closest(".read");
  if(read){onRead(+read.parentElement.querySelector(".card").dataset.id);return;}
  const card=e.target.closest(".card"); if(!card)return;
  strip.querySelectorAll(".card").forEach(c=>{c.setAttribute("aria-pressed","false");c.setAttribute("aria-selected","false");c.classList.remove("is-opening");});
  card.setAttribute("aria-pressed","true"); card.setAttribute("aria-selected","true");
  card.classList.add("is-opening"); S.selected=+card.dataset.id;
  clearTimeout(S._t); S._t=setTimeout(()=>card.classList.remove("is-opening"),1400);
  onCardClick(S.selected);
});
strip.addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  e.preventDefault();
  const d=e.key==="ArrowRight"?1:-1;
  const cards=strip.querySelectorAll(".card");
  const ni=Math.max(0,Math.min(cards.length-1,S.focusIdx+d));
  if(ni===S.focusIdx)return;
  cards[S.focusIdx].tabIndex=-1; cards[ni].tabIndex=0;
  cards[ni].focus({preventScroll:true}); S.focusIdx=ni;
  const it=cards[ni].closest(".item"), L=it.offsetLeft-strip.offsetLeft;
  if(L<strip.scrollLeft+18) strip.scrollTo({left:L-18,behavior:"smooth"});
  else if(L+it.offsetWidth>strip.scrollLeft+strip.clientWidth-18)
    strip.scrollTo({left:L+it.offsetWidth-strip.clientWidth+18,behavior:"smooth"});
});
strip.addEventListener("focusin",e=>{
  const card=e.target.closest(".card");
  if(card) S.focusIdx=+card.closest(".item").dataset.idx;
});
document.getElementById("retry").addEventListener("click",()=>{
  setState("loading"); setTimeout(()=>setState("results"),900);
});

/* ================= dev toolbar ================= */
function setState(st){
  S.state=st;
  w.dataset.state=st==="lowconf"?"results":st;
  w.dataset.lowconf=st==="lowconf"?"1":"0";
  if(st==="lowconf"&&S.mode!=="semantic")setMode("semantic");
  if(st==="results"||st==="lowconf")renderResults(); else pos.textContent="";
  reportSize();
}
function setMode(m){S.mode=m;w.dataset.mode=m;flow.dataset.mode=m;syncBar("mode",m);}
function syncBar(g,v){document.querySelectorAll(`.devbar [data-set="${g}"] button`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));}
document.querySelector(".devbar").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  const g=b.closest(".grp").dataset.set, v=b.dataset.v;
  syncBar(g,v);
  if(g==="theme"){S.theme=v; v==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",v);}
  if(g==="state")setState(v);
  if(g==="mode")setMode(v);
  if(g==="count"){S.count=+v; if(S.state==="results"||S.state==="lowconf")renderResults(); renderFlow();}
});
window.addEventListener("resize",updatePosition);

/* ================= alt: coverflow ================= */
const FSTEP=70;
const flow=document.getElementById("flow"), fscroll=document.getElementById("fscroll"),
      fstage=document.getElementById("fstage"), frow=document.getElementById("frow"),
      fprev=document.getElementById("fprev"), fnext=document.getElementById("fnext"),
      fpos=document.getElementById("fpos"), ft=document.getElementById("ft"),
      fa=document.getElementById("fa"), fread=document.getElementById("fread");
const F={n:0,cur:0,lastC:-1};

function renderFlow(){
  F.n=S.count; F.lastC=-1;
  frow.style.paddingInline=(fscroll.clientWidth/2-FSTEP/2)+"px";
  frow.innerHTML='<div class="fsnap"></div>'.repeat(F.n);
  const frag=[];
  for(let i=0;i<F.n;i++){
    const b=bookAt(i), h=hash(b.title)%360, h2=(h+38)%360, v=hash(b.title)%3;
    const raw=isRaw(b.title), authors=b.authors.join(", ");
    frag.push(`<li class="fitem" data-idx="${i}">
      <button class="card" role="option" aria-selected="false" aria-pressed="false" data-id="${b.bookId}" tabindex="-1">
        <span class="cover" style="--h:${h};--h2:${h2}">
          <span class="ph" data-v="${v}"><span class="mark"></span>
            <span class="pt${raw?" raw":""}">${esc(b.title)}</span>
            <span class="pa">${esc(authors)}</span></span>
          ${b.hasCover?`<img alt="" src="http://localhost:8080/get/thumb/${b.bookId}/lib" onerror="this.setAttribute('data-broken','')">`:""}
          <span class="score">${b.score.toFixed(2)}</span>
          <span class="opening">Opening…</span>
        </span>
      </button>
    </li>`);
  }
  fstage.innerHTML=frag.join("");
  fscroll.scrollLeft=0;
  layoutFlow();
}
function layoutFlow(){
  const cur=fscroll.scrollLeft/FSTEP; F.cur=cur;
  fstage.querySelectorAll(".fitem").forEach((el,i)=>{
    const e=i-cur, k=Math.max(-1,Math.min(1,e)), ae=Math.abs(e);
    const x=e*54+k*54, rot=-k*42, z=(1-Math.abs(k))*80;
    const sc=Math.max(.55,1-Math.min(ae,5)*.075);           /* ← edges shrink */
    el.style.transform=`translateX(${x}px) translateZ(${z}px) rotateY(${rot}deg) scale(${sc})`;
    el.style.zIndex=String(200-Math.round(ae*10));
    el.style.opacity=String(Math.max(0,Math.min(1,1-(ae-3.4)*.5)));
  });
  const c=Math.max(0,Math.min(F.n-1,Math.round(cur)));
  if(c!==F.lastC){F.lastC=c;const b=bookAt(c);
    ft.textContent=b.title;
    fa.textContent=b.authors.join(", ")||"—";
  }
  fprev.disabled=cur<=0.02; fnext.disabled=cur>=F.n-1.02;
  fpos.textContent=`${c+1} of ${F.n}`;
}
fscroll.addEventListener("scroll",()=>requestAnimationFrame(layoutFlow));
fprev.addEventListener("click",()=>fscroll.scrollTo({left:(Math.round(F.cur)-1)*FSTEP,behavior:"smooth"}));
fnext.addEventListener("click",()=>fscroll.scrollTo({left:(Math.round(F.cur)+1)*FSTEP,behavior:"smooth"}));
fstage.addEventListener("click",e=>{
  const li=e.target.closest(".fitem"); if(!li)return;
  const i=+li.dataset.idx;
  if(Math.round(F.cur)!==i){fscroll.scrollTo({left:i*FSTEP,behavior:"smooth"});return;}
  selectFlowCenter();
});
function selectFlowCenter(){
  const c=Math.round(F.cur), card=fstage.querySelector(`.fitem[data-idx="${c}"] .card`);
  if(!card)return;
  fstage.querySelectorAll(".card").forEach(x=>{x.setAttribute("aria-pressed","false");x.setAttribute("aria-selected","false");x.classList.remove("is-opening");});
  card.setAttribute("aria-pressed","true"); card.setAttribute("aria-selected","true");
  card.classList.add("is-opening");
  clearTimeout(F._t); F._t=setTimeout(()=>card.classList.remove("is-opening"),1400);
  onCardClick(+card.dataset.id);
}
fscroll.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();
    const d=e.key==="ArrowRight"?1:-1;
    fscroll.scrollTo({left:(Math.round(F.cur)+d)*FSTEP,behavior:"smooth"});}
  if(e.key==="Enter"||e.key===" "){e.preventDefault();selectFlowCenter();}
});
fread.addEventListener("click",()=>onRead(bookAt(Math.max(0,Math.min(F.n-1,Math.round(F.cur)))).bookId));
window.addEventListener("resize",()=>{frow.style.paddingInline=(fscroll.clientWidth/2-FSTEP/2)+"px";layoutFlow();});
renderFlow();

/* boot: loading first (widget renders before data), then results */
renderSkeleton();
setState("loading");
setTimeout(()=>{setState("results");syncBar("state","results");},1100);
</script>
