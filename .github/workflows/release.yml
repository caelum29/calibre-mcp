# Release pipeline, triggered by pushing a v* tag:
#   npm publish (with provenance) -> .mcpb on the GitHub release -> MCP Registry.
# npm auth = Trusted Publishing (OIDC), configured on npmjs.com under the package's
# Settings -> Trusted Publisher (repo caelum29/calibre-mcp, workflow release.yml).
# No secrets anywhere: MCP Registry auth is also OIDC (io.github.caelum29 namespace).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + mcp-publisher OIDC
      contents: write # create the GitHub release / upload the .mcpb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      # No registry-url here: it writes an .npmrc _authToken placeholder that overrides
      # the OIDC trusted-publishing flow with an empty token (PUT then 404s).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches package.json version
        run: |
          PKG_V="$(node -p "require('./package.json').version")"
          [ "v$PKG_V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$PKG_V"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm typecheck

      # Pinned + checksum-verified: this job holds id-token: write, so a moved `latest`
      # asset must not be able to run here. The sha256 is the linux_amd64 entry of the
      # release's registry_<ver>_checksums.txt (the job runs on ubuntu, x86_64).
      - name: Install mcp-publisher (pinned)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # server.json versions are committed (pnpm versions:check gates them), not
      # rewritten here — what is published is what is in the tagged commit. Validated
      # before npm publish so a bad server.json fails the release before anything ships.
      - name: Validate server.json against the MCP Registry
        run: ./mcp-publisher validate

      # Trusted-publishing OIDC auto-detection needs npm >= 11.5.1; runners can lag.
      # Pin to 11.18.0 — npm@latest (12.0.0) ships a libnpmpublish whose provenance
      # code can't resolve its `sigstore` dep, breaking `npm publish --provenance`.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.18.0 && npm --version

      # prepublishOnly runs build + tests; auth is OIDC (trusted publisher), no token
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Build the MCPB bundle
        run: pnpm pack:mcpb

      - name: Create GitHub release with the .mcpb
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
